<style>
:root{--bg:#f4f0e3;--card:#fffdf6;--text:#24362b;--muted:#6f7d70;--line:#e4dcc4;--accent:#3a5846;--accent2:#2c4034;--bad:#c0452f;--on:#fff;--sky1:#d5e9d2;--sky2:#f4efdc;--h1:#c3cf9f;--h2:#8aa985;--h3:#2c4034;--sun:#e8d79c}
@media(prefers-color-scheme:dark){:root{--bg:#111a14;--card:#1a251d;--text:#e8efe3;--muted:#9bab9c;--line:#2c3b30;--accent:#86c28f;--accent2:#a5d8ac;--bad:#f08a76;--on:#10200f;--sky1:#20382a;--sky2:#15221a;--h1:#2c4a35;--h2:#244030;--h3:#1b3225;--sun:#c9b36a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--bg));color:var(--text);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;position:relative;overflow:hidden}
.hills{position:fixed;left:0;bottom:0;width:100%;height:34vh;min-height:140px}
.sun{position:fixed;top:9%;right:14%;width:64px;height:64px;border-radius:50%;background:var(--sun);opacity:.85;box-shadow:0 0 0 18px rgba(243,217,139,.2)}
@media(prefers-color-scheme:dark){.logo{background:#fffdf6;border-radius:12px;padding:8px 12px}}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:20px;padding:26px 24px;width:min(360px,90vw);box-shadow:0 12px 40px rgba(40,70,50,.18);text-align:center}
.logo{width:min(280px,100%);display:block;margin:0 auto 4px}
.dark-only{}h1{margin:0;font:700 28px/1.2 "Noto Serif TC","Songti TC","PMingLiU",serif;letter-spacing:.16em;color:var(--accent2)}
.sub{margin:4px 0 18px;font-size:13px;letter-spacing:.3em;color:var(--muted)}
input[type=password]{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);text-align:center;letter-spacing:.2em}
input:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin:12px 0}
label input{width:auto}
button{font:inherit;width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--on);cursor:pointer;letter-spacing:.2em}
button:hover{background:var(--accent2)}button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var $ = function(i){ return document.getElementById(i); };
  var u8 = function(b){ return Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); }); };
  async function open(pw){
    if(!window.crypto || !crypto.subtle) throw new Error('NOCRYPTO');
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.ct));
    return new TextDecoder().decode(pt);
  }
  function boot(html, pw){
    var inj = '<script>window.__BOOT=' + JSON.stringify({pw:pw}).replace(/</g,'\\u003c') + '<\/script>';
    html = html.replace('<head>', '<head>' + inj);
    document.open(); document.write(html); document.close();
  }
  async function attempt(pw, remember){
    var html = await open(pw);
    if(remember){ try{ localStorage.setItem('rev.pw', pw); }catch(e){} }
    boot(html, pw);
  }
  async function go(){
    $('err').textContent = ''; $('go').disabled = true;
    try{ await attempt($('pw').value, $('rem').checked); }
    catch(e){
      $('err').textContent = e.message==='NOCRYPTO' ? '此瀏覽器環境不支援(請用 https 網址開啟)' : '密碼錯誤';
      $('go').disabled = false; $('pw').select();
    }
  }
  $('go').onclick = go;
  $('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
  var saved = null; try{ saved = localStorage.getItem('rev.pw'); }catch(e){}
  if(saved){ attempt(saved, false).catch(function(){ try{ localStorage.removeItem('rev.pw'); }catch(e){} }); }
})();
</script>
