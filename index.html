<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日營收日曆</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-soft:#dbeafe;--good:#059669;--bad:#dc2626;--today:#fef3c7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#1a212b;--text:#e5e7eb;--muted:#9ca3af;--line:#2d3748;--accent:#60a5fa;--accent-soft:#1e3a5f;--good:#34d399;--bad:#f87171;--today:#4a3d12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--good)}.status.err{color:var(--bad)}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.nav h2{margin:0;font-size:18px;min-width:140px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:13px;color:var(--muted);padding:4px 0}
.day{min-height:84px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.day:hover{border-color:var(--accent)}
.day.empty{background:transparent;border:none;cursor:default}
.day.today{background:var(--today)}
.day .n{font-size:13px;color:var(--muted)}
.day .amt{font-weight:600;font-size:14px;color:var(--good);text-align:right;word-break:break-all}
.day .cnt{font-size:11px;color:var(--muted);text-align:right}
.day.has{border-color:var(--accent-soft);background:linear-gradient(var(--accent-soft),var(--card) 140%)}
.pay{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.pay span{display:inline-block;margin:2px 12px 2px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:16px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.form .full{grid-column:1/-1}
input,select{font:inherit;width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.total{display:flex;justify-content:space-between;font-weight:600;margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
@media(max-width:600px){.day{min-height:62px;padding:4px}.day .amt{font-size:11px}.wrap{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 每日營收日曆</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="status" class="status">尚未連線雲端</span>
      <button id="btnSync">立即同步</button>
      <button id="btnCsv">匯出 CSV</button>
      <button id="btnSet">⚙ 雲端設定</button>
    </div>
  </header>

  <div class="nav">
    <button id="prev">◀</button>
    <h2 id="title"></h2>
    <button id="next">▶</button>
    <button id="goToday">今天</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="cal" id="cal"></div>
  <div class="pay" id="pay"></div>
  <p class="hint">點日期可新增 / 編輯當天的明細。資料會自動存到你的 GitHub 倉庫(data.json),同時也會暫存在這台裝置。</p>
</div>

<!-- 當日明細 -->
<dialog id="dlgDay">
  <h3 id="dayTitle"></h3>
  <table><thead><tr><th>類別 / 品項</th><th>付款</th><th class="r">金額</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <div class="total"><span>當日合計</span><span id="dayTotal"></span></div>
  <div class="form">
    <div><label>收入類別</label><select id="fCat"></select></div>
    <div id="newCatBox" style="display:none"><label>新類別名稱</label><input id="fNewCat" placeholder="例如:餐飲"></div>
    <div><label>品項</label><input id="fItem" list="itemList" placeholder="例如:雙人帳"></div>
    <div><label>付款方式</label><select id="fPay"></select></div>
    <div><label>金額</label><input id="fAmt" type="number" inputmode="decimal" placeholder="0"></div>
    <div><label>備註(選填)</label><input id="fNote"></div>
    <div class="full row"><button class="primary" id="btnAdd">＋ 新增這筆</button></div>
  </div>
  <datalist id="itemList"></datalist>
  <div class="row"><button id="closeDay">完成</button></div>
</dialog>

<!-- 雲端設定 -->
<dialog id="dlgSet">
  <h3>GitHub 雲端設定</h3>
  <p class="hint">資料會存成你倉庫裡的 <b>data.json</b>。Token 只存在這個瀏覽器,不會上傳。設定步驟請看 README。</p>
  <div class="form">
    <div><label>GitHub 帳號 (owner)</label><input id="sOwner"></div>
    <div><label>倉庫名稱 (repo)</label><input id="sRepo"></div>
    <div><label>分支 (branch)</label><input id="sBranch" value="main"></div>
    <div><label>檔案路徑</label><input id="sPath" value="data.json"></div>
    <div class="full"><label>Personal Access Token</label><input id="sToken" type="password" placeholder="github_pat_..."></div>
    <div class="full"><label>收入類別(用逗號分隔)</label><input id="sCats"></div>
    <div class="full"><label>付款方式(用逗號分隔)</label><input id="sPays"></div>
  </div>
  <div class="row"><button id="sCancel">取消</button><button class="primary" id="sSave">儲存並連線</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const LS_DATA = 'rev.data.v1', LS_CFG = 'rev.cfg.v1';
const DEFAULT_PAYS = ['現金','信用卡','LINE Pay','行動支付','轉帳'];
const DEFAULT_CATS = ['野餐','民宿','露營'];
let data = {};          // { "2026-10-01": [ {id,item,pay,amt,note} ] }
let cfg = { owner:'', repo:'', branch:'main', path:'data.json', token:'', pays: DEFAULT_PAYS, cats: DEFAULT_CATS };
let sha = null, saveTimer = null, saving = false, dirty = false;
let cur = new Date(); cur.setDate(1);
let selDate = null;

const money = n => 'NT$ ' + (Math.round(n*100)/100).toLocaleString('zh-TW');
const ymd = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dayTotal = k => (data[k]||[]).reduce((s,e)=>s+(+e.amt||0),0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setStatus(t,cls=''){ const s=$('status'); s.textContent=t; s.className='status '+cls; }

/* ---------- 本機暫存 ---------- */
function loadLocal(){
  try{ data = JSON.parse(localStorage.getItem(LS_DATA)||'{}'); }catch{ data={}; }
  try{ Object.assign(cfg, JSON.parse(localStorage.getItem(LS_CFG)||'{}')); }catch{}
  if(!cfg.pays?.length) cfg.pays = DEFAULT_PAYS;
  if(!cfg.cats?.length) cfg.cats = DEFAULT_CATS;
}
// 類別清單 = 設定的類別 + 資料裡出現過的類別(換裝置也看得到)
function allCats(){
  const set = new Set(cfg.cats);
  Object.values(data).flat().forEach(e=>e.cat&&set.add(e.cat));
  return [...set];
}
const saveLocal = () => { try{ localStorage.setItem(LS_DATA, JSON.stringify(data)); }catch{} };
const saveCfg = () => { try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch{} };
const cloudReady = () => cfg.owner && cfg.repo && cfg.token;

/* ---------- GitHub 雲端 ---------- */
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')), c=>c.charCodeAt(0)));
const api = () => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
const hdr = () => ({Authorization:`Bearer ${cfg.token}`, Accept:'application/vnd.github+json'});

async function pull(){
  if(!cloudReady()) return;
  setStatus('讀取雲端中…');
  const r = await fetch(`${api()}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`, {headers:hdr()});
  if(r.status===404){ sha=null; setStatus('雲端尚無資料檔,第一次儲存時會自動建立','ok'); return; }
  if(!r.ok) throw new Error(r.status===401?'Token 無效或已過期':`讀取失敗 (${r.status})`);
  const j = await r.json();
  sha = j.sha;
  const remote = JSON.parse(b64dec(j.content)||'{}');
  if(dirty){ // 本機有未上傳的變動:以日為單位合併(本機優先)
    data = {...remote, ...data};
  } else data = remote;
  saveLocal(); render();
  setStatus('已從雲端載入 ✓','ok');
}

async function push(){
  if(!cloudReady()){ setStatus('資料已存在本機(尚未設定雲端)'); return; }
  if(saving){ dirty=true; return; }
  saving = true; setStatus('儲存到雲端中…');
  try{
    for(let attempt=0; attempt<2; attempt++){
      const body = { message:`更新營收 ${new Date().toISOString()}`, branch:cfg.branch,
                     content:b64enc(JSON.stringify(data,null,1)) };
      if(sha) body.sha = sha;
      const r = await fetch(api(), {method:'PUT', headers:{...hdr(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(r.ok){ sha=(await r.json()).content.sha; dirty=false; setStatus('已儲存到雲端 ✓ '+new Date().toLocaleTimeString('zh-TW'),'ok'); return; }
      if(r.status===409 || r.status===422){ // 檔案在別處被改過:取最新 sha 與內容合併後重試
        const g = await fetch(`${api()}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`,{headers:hdr()});
        if(g.ok){ const j=await g.json(); sha=j.sha; data={...JSON.parse(b64dec(j.content)||'{}'),...data}; continue; }
      }
      throw new Error(r.status===401?'Token 無效':r.status===403||r.status===404?'沒有權限或找不到倉庫,請檢查設定':`儲存失敗 (${r.status})`);
    }
  }catch(e){ setStatus('⚠ '+e.message+'(資料仍保留在本機)','err'); dirty=true; }
  finally{ saving=false; }
}

function changed(){
  dirty = true; saveLocal(); render();
  setStatus(cloudReady()?'有變更,稍後自動上傳…':'資料已存在本機(尚未設定雲端)');
  clearTimeout(saveTimer); saveTimer = setTimeout(push, 1500);
}

/* ---------- 畫面 ---------- */
function render(){
  const y=cur.getFullYear(), m=cur.getMonth();
  $('title').textContent = `${y} 年 ${m+1} 月`;
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  const today = new Date(), tk = ymd(today.getFullYear(),today.getMonth(),today.getDate());
  let h = ['日','一','二','三','四','五','六'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="day empty"></div>';
  let sum=0, rec=0, best=null, byPay={}, byCat={}, cnt=0;
  for(let d=1; d<=days; d++){
    const k=ymd(y,m,d), list=data[k]||[], t=dayTotal(k);
    if(list.length){ sum+=t; rec++; cnt+=list.length; if(!best||t>best.t) best={k,t};
      list.forEach(e=>{ byPay[e.pay]=(byPay[e.pay]||0)+(+e.amt||0); const c=e.cat||'未分類'; byCat[c]=(byCat[c]||0)+(+e.amt||0); }); }
    h+=`<div class="day${k===tk?' today':''}${list.length?' has':''}" data-k="${k}">
      <div class="n">${d}</div>
      <div>${list.length?`<div class="amt">${money(t)}</div><div class="cnt">${list.length} 筆</div>`:''}</div></div>`;
  }
  $('cal').innerHTML = h;
  $('stats').innerHTML = [
    ['本月營收', money(sum)],
    ['有紀錄天數', rec+' 天'],
    ['日均營收', rec?money(sum/rec):'—'],
    ['最高單日', best?`${money(best.t)}(${+best.k.slice(8)}日)`:'—'],
    ['明細筆數', cnt+' 筆']
  ].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('');
  const line = (t,o)=>'<div><b>'+t+':</b>'+Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${esc(k)} ${money(v)}</span>`).join('')+'</div>';
  $('pay').innerHTML = Object.keys(byPay).length ? line('類別統計',byCat)+line('付款方式統計',byPay) : '本月尚無紀錄';
}

function openDay(k){
  selDate=k;
  const [y,m,d]=k.split('-');
  $('dayTitle').textContent = `${y} 年 ${+m} 月 ${+d} 日`;
  fillCats();
  $('fPay').innerHTML = cfg.pays.map(p=>`<option>${esc(p)}</option>`).join('');
  const items = new Set(); Object.values(data).flat().forEach(e=>e.item&&items.add(e.item));
  $('itemList').innerHTML = [...items].map(i=>`<option value="${esc(i)}">`).join('');
  renderRows(); $('dlgDay').showModal(); $('fItem').focus();
}
function fillCats(sel){
  const cats = allCats();
  $('fCat').innerHTML = cats.map(c=>`<option>${esc(c)}</option>`).join('') + '<option value="__new__">＋ 新增類別…</option>';
  if(sel) $('fCat').value = sel;
  $('newCatBox').style.display = 'none';
}
function renderRows(){
  const list = data[selDate]||[];
  $('rows').innerHTML = list.length ? list.map(e=>`<tr>
    <td><b>${esc(e.cat||'未分類')}</b> ${esc(e.item)}${e.note?`<div class="hint">${esc(e.note)}</div>`:''}</td><td>${esc(e.pay)}</td>
    <td class="r">${money(+e.amt)}</td><td class="r"><button class="danger" data-del="${e.id}">刪</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="hint">這天還沒有明細</td></tr>';
  $('dayTotal').textContent = money(dayTotal(selDate));
}
function addEntry(){
  const amt = parseFloat($('fAmt').value);
  if(!isFinite(amt)){ $('fAmt').focus(); return; }
  let cat = $('fCat').value;
  if(cat==='__new__'){
    cat = $('fNewCat').value.trim();
    if(!cat){ $('fNewCat').focus(); return; }
    if(!cfg.cats.includes(cat)){ cfg.cats.push(cat); saveCfg(); }
    $('fNewCat').value='';
  }
  (data[selDate] ||= []).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    cat, item:$('fItem').value.trim()||'未命名', pay:$('fPay').value, amt, note:$('fNote').value.trim()});
  $('fItem').value=''; $('fAmt').value=''; $('fNote').value='';
  fillCats(cat); renderRows(); changed(); $('fItem').focus();
}
function delEntry(id){
  data[selDate] = (data[selDate]||[]).filter(e=>e.id!==id);
  if(!data[selDate].length) delete data[selDate];
  renderRows(); changed();
}

function exportCsv(){
  const rows=[['日期','類別','品項','付款方式','金額','備註']];
  Object.keys(data).sort().forEach(k=>data[k].forEach(e=>rows.push([k,e.cat||'未分類',e.item,e.pay,e.amt,e.note||''])));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='營收明細.csv'; a.click();
}

/* ---------- 事件 ---------- */
$('cal').onclick = e => { const d=e.target.closest('.day[data-k]'); if(d) openDay(d.dataset.k); };
$('prev').onclick = () => { cur.setMonth(cur.getMonth()-1); render(); };
$('next').onclick = () => { cur.setMonth(cur.getMonth()+1); render(); };
$('goToday').onclick = () => { cur=new Date(); cur.setDate(1); render(); };
$('btnAdd').onclick = addEntry;
$('fCat').onchange = () => { const n=$('fCat').value==='__new__'; $('newCatBox').style.display=n?'':'none'; if(n) $('fNewCat').focus(); };
['fItem','fAmt','fNote','fNewCat'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') addEntry(); }));
$('rows').onclick = e => { const b=e.target.closest('[data-del]'); if(b) delEntry(b.dataset.del); };
$('closeDay').onclick = () => $('dlgDay').close();
$('btnCsv').onclick = exportCsv;
$('btnSync').onclick = async () => {
  if(!cloudReady()){ $('btnSet').click(); return; }
  try{ await pull(); if(dirty) await push(); }catch(e){ setStatus('⚠ '+e.message,'err'); }
};
$('btnSet').onclick = () => {
  $('sOwner').value=cfg.owner; $('sRepo').value=cfg.repo; $('sBranch').value=cfg.branch;
  $('sPath').value=cfg.path; $('sToken').value=cfg.token; $('sPays').value=cfg.pays.join(','); $('sCats').value=cfg.cats.join(',');
  $('dlgSet').showModal();
};
$('sCancel').onclick = () => $('dlgSet').close();
$('sSave').onclick = async () => {
  cfg = { owner:$('sOwner').value.trim(), repo:$('sRepo').value.trim(), branch:$('sBranch').value.trim()||'main',
          path:$('sPath').value.trim()||'data.json', token:$('sToken').value.trim(),
          pays:$('sPays').value.split(/[,,]/).map(s=>s.trim()).filter(Boolean),
          cats:$('sCats').value.split(/[,,]/).map(s=>s.trim()).filter(Boolean) };
  if(!cfg.pays.length) cfg.pays = DEFAULT_PAYS;
  if(!cfg.cats.length) cfg.cats = DEFAULT_CATS;
  saveCfg(); $('dlgSet').close();
  try{ await pull(); if(dirty||sha===null&&Object.keys(data).length) await push(); }
  catch(e){ setStatus('⚠ '+e.message,'err'); }
};
window.addEventListener('beforeunload', e => { if(dirty && cloudReady()){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && cloudReady() && !dirty) pull().catch(()=>{}); });

/* ---------- 啟動 ---------- */
loadLocal(); render();
if(cloudReady()) pull().catch(e=>setStatus('⚠ '+e.message+'(使用本機資料)','err'));
else setStatus('尚未連線雲端,資料暫存在本機');
</script>
</body>
</html>
