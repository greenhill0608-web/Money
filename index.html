<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bad:#dc2626}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}

input[type=password]{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:10px 0}
button{font:inherit;width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
</style>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var $ = function(i){ return document.getElementById(i); };
  var u8 = function(b){ return Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); }); };
  async function open(pw){
    if(!window.crypto || !crypto.subtle) throw new Error('NOCRYPTO');
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.ct));
    return new TextDecoder().decode(pt);
  }
  function boot(html, pw){
    var inj = '<script>window.__BOOT=' + JSON.stringify({pw:pw}).replace(/</g,'\\u003c') + '<\/script>';
    html = html.replace('<head>', '<head>' + inj);
    document.open(); document.write(html); document.close();
  }
  async function attempt(pw, remember){
    var html = await open(pw);
    if(remember){ try{ localStorage.setItem('rev.pw', pw); }catch(e){} }
    boot(html, pw);
  }
  async function go(){
    $('err').textContent = ''; $('go').disabled = true;
    try{ await attempt($('pw').value, $('rem').checked); }
    catch(e){
      $('err').textContent = e.message==='NOCRYPTO' ? '此瀏覽器環境不支援(請用 https 網址開啟)' : '密碼錯誤';
      $('go').disabled = false; $('pw').select();
    }
  }
  $('go').onclick = go;
  $('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
  var saved = null; try{ saved = localStorage.getItem('rev.pw'); }catch(e){}
  if(saved){ attempt(saved, false).catch(function(){ try{ localStorage.removeItem('rev.pw'); }catch(e){} }); }
})();
</script>
